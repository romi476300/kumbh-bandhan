<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KUMBH BANDHAN - Safety Bands</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Yatra+One&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff5e6;
            color: #4b2a1f;
            font-family: "Baloo 2", sans-serif;
        }

        header {
            text-align: center;
            padding: 25px;
        }

        .devanagari-title {
            font-family: "Yatra One", cursive;
            font-size: 42px;
            color: #9c3f18;
        }

        .english-title {
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #76564b;
        }

        .back {
            display: inline-block;
            margin-top: 10px;
            color: #236b73;
            text-decoration: none;
            font-weight: 700;
        }

        .container {
            width: 92%;
            max-width: 1050px;
            margin: auto;
        }

        .family-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(75,42,31,.10);
            margin-bottom: 25px;
        }

        .family-id {
            display: inline-block;
            padding: 10px 22px;
            background: #fff0df;
            border: 2px dashed #c94f16;
            border-radius: 12px;
            color: #9c3f18;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .bands {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px,1fr)
            );
            gap: 22px;
        }

        .band {
            background: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border-top: 6px solid #c94f16;
            box-shadow: 0 8px 25px rgba(75,42,31,.10);
        }

        .band-number {
            color: #236b73;
            font-weight: 800;
        }

        .member-name {
            font-size: 27px;
            font-weight: 800;
            color: #5b2c20;
        }

        .member-info {
            color: #76564b;
            margin-bottom: 15px;
        }

        .band-id {
            background: #f4ffff;
            border: 1px solid #b9dfe1;
            padding: 10px;
            border-radius: 10px;
            color: #236b73;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .qr {
            width: 210px;
            height: 210px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .qr img {
            width: 200px;
            height: 200px;
            display: block;
        }

        .scan {
            margin-top: 12px;
            color: #76564b;
            font-size: 14px;
        }

        .note {
            margin-top: 8px;
            font-size: 12px;
            color: #9a7a6d;
        }

        .home {
            display: block;
            width: 260px;
            margin: 35px auto;
            padding: 14px;
            text-align: center;
            text-decoration: none;
            color: white;
            background: linear-gradient(
                135deg,
                #236b73,
                #3c9297
            );
            border-radius: 12px;
            font-weight: 800;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #76564b;
        }

    </style>

</head>


<body>


<header>

    <div class="devanagari-title">
        कुंभ बंधन
    </div>

    <div class="english-title">
        KUMBH BANDHAN
    </div>

    <div class="subtitle">
        Smart Family Safety & Reunification System
    </div>

    <a
        class="back"
        href="index.html"
    >
        ← Back to Home
    </a>

</header>


<main class="container">


    <section class="family-card">

        <h2>
            🎟️ Family Safety Bands
        </h2>

        <p>
            Family ID
        </p>

        <div
            class="family-id"
            id="familyId"
        >
            Loading...
        </div>

        <p>
            Each family member receives a unique
            Band ID and QR code.
        </p>

    </section>


    <section
        class="bands"
        id="bandsContainer"
    ></section>


    <a
        class="home"
        href="index.html"
    >
        ← Return to Home
    </a>


</main>


<footer>

    KUMBH BANDHAN • Nashik Kumbh 2027

</footer>


<script>


const familyId =
    localStorage.getItem("familyId") ||
    "KB-27-00000";


document.getElementById(
    "familyId"
).textContent = familyId;


let members = [];


try {

    members =
        JSON.parse(
            localStorage.getItem("familyMembers") || "[]"
        );

} catch {

    members = [];

}


// DEMO DATA

if (members.length === 0) {

    members = [

        {
            name: "Family Member 1",
            age: "35",
            relation: "Parent"
        },

        {
            name: "Family Member 2",
            age: "32",
            relation: "Spouse"
        },

        {
            name: "Family Member 3",
            age: "8",
            relation: "Child"
        }

    ];

}


const container =
    document.getElementById("bandsContainer");


members.forEach(function(member,index) {


    const bandId =
        familyId +
        "-" +
        String(index + 1).padStart(2,"0");


    /*
        THIS IS THE INFORMATION
        STORED INSIDE THE QR CODE.

        At the current prototype stage,
        it contains readable identification data.
    */

    const qrData =
        "KUMBH BANDHAN\n" +
        "Family ID: " + familyId + "\n" +
        "Band ID: " + bandId + "\n" +
        "Member: " + member.name;


    /*
        ONLINE QR IMAGE GENERATOR
    */

    const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=200x200&data=" +
        encodeURIComponent(qrData);


    const card =
        document.createElement("div");


    card.className = "band";


    card.innerHTML = `

        <div class="band-number">
            KUMBH BANDHAN • BAND ${index + 1}
        </div>


        <div class="member-name">
            ${member.name}
        </div>


        <div class="member-info">

            Age: ${member.age || "—"}

            &nbsp; • &nbsp;

            ${member.relation || "Family Member"}

        </div>


        <div class="band-id">

            Band ID: ${bandId}

        </div>


        <div class="qr">

            <img
                src="${qrURL}"
                alt="KUMBH BANDHAN QR Code"
            >

        </div>


        <div class="scan">

            📱 Scan this QR code

        </div>


        <div class="note">

            QR contains Family ID + Band ID

        </div>

    `;


    container.appendChild(card);

});


</script>


</body>

</html>
