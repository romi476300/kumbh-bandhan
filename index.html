<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KUMBH BANDHAN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Yatra+One&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="devanagari-title">
        कुंभ बंधन
    </div>

    <div class="english-title">
        KUMBH BANDHAN
    </div>

    <div class="subtitle">
        Smart Family Safety & Reunification System
    </div>

</header>


<main>

    <section class="hero">

        <div class="hero-text">

            <div class="tagline">
                बंधन जो परिवार को जोड़े
            </div>

            <p>
                Stay Connected • Stay Safe • Reunite Faster
            </p>

        </div>


        <div class="button-container">

            <button
                class="main-button register"
                onclick="window.location.href='register.html'"
            >

                <div class="button-icon">
                    🧡
                </div>

                <span>
                    Register Your Family
                </span>

                <small>
                    Create your family safety profile
                </small>

            </button>


            <button
                class="main-button scan"
                onclick="scanBand()"
            >

                <div class="button-icon">
                    📱
                </div>

                <span>
                    Scan / Verify Band
                </span>

                <small>
                    Help a separated family member
                </small>

            </button>

        </div>


        <div class="illustration">

            <img
                src="kumbh-illustration.png"
                alt="Kumbh Bandhan Kumbh 2027 Illustration"
            >

        </div>

    </section>


    <section class="trust">

        <div>
            🧡 Family First
        </div>

        <div>
            📍 Zone-Based Assistance
        </div>

        <div>
            🚨 Emergency Support
        </div>

        <div>
            🤝 Faster Reunification
        </div>

    </section>

</main>


<footer>

    KUMBH BANDHAN • Nashik Kumbh 2027

</footer>


<script>

function scanBand() {

    alert(
        "Scan / Verify Band\n\n" +
        "Scan a KUMBH BANDHAN QR code to help " +
        "a separated family member."
    );

}

</script>


</body>

</html>
